<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TUPS Technologies</title>

  <meta
    name="description"
    content="TUPS Technologies — Technology solutions for modern schools."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">

    <div class="header-brand">
      <div class="logo-placeholder">
        TUPS
      </div>

      <div class="brand-text">
        <h1>TUPS</h1>
        <span>TECHNOLOGIES</span>
      </div>
    </div>


    <!-- Main Navigation -->
    <nav class="main-navigation">

      <button
        class="nav-button active"
        data-page="about"
      >
        About Us
      </button>

      <button
        class="nav-button"
        data-page="services"
      >
        Our Services
      </button>

      <button
        class="nav-button"
        data-page="clients"
      >
        Clients &amp; Products
      </button>

      <button
        class="nav-button"
        data-page="faqs"
      >
        FAQs
      </button>

    </nav>


    <!-- Portal Buttons -->
    <div class="portal-buttons">

      <button
        class="portal-button cbt-button"
        type="button"
        title="CBT Portal coming soon"
      >
        TUP CBT Portal
      </button>

      <a
        href="https://www.tupstechnologies.com"
        target="_blank"
        rel="noopener noreferrer"
        class="portal-button school-portal-button"
      >
        TUPS School Portal
      </a>

    </div>

  </header>


  <!-- ================= PAGE LAYOUT ================= -->
  <div class="page-layout">


    <!-- ================= LEFT SIDEBAR ================= -->
    <aside class="sidebar">

      <div class="sidebar-heading">
        <span class="sidebar-icon">◆</span>
        <h2>Our Partner Schools</h2>
      </div>


      <div class="partner-schools">


        <!-- School 1 -->
        <button
          class="school-item"
          data-school="tender-lilies"
        >

          <div class="school-logo-placeholder">
            TL
          </div>

          <span>
            Tender Lilies<br>
            Royal Academy
          </span>

        </button>


        <!-- School 2 -->
        <button
          class="school-item"
          data-school="tree-hill"
        >

          <div class="school-logo-placeholder">
            TH
          </div>

          <span>
            Tree Hill Academy
          </span>

        </button>


        <!-- School 3 -->
        <button
          class="school-item"
          data-school="lead-british"
        >

          <div class="school-logo-placeholder">
            LB
          </div>

          <span>
            Lead British<br>
            International School
          </span>

        </button>


        <!-- Future Schools -->
        <button
          class="school-item"
          data-school="future-school"
        >

          <div class="school-logo-placeholder">
            +
          </div>

          <span>
            More Partner Schools
          </span>

        </button>

      </div>

    </aside>



    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">

      <div
        id="content-area"
        class="content-area"
      >

        <!-- JavaScript loads the initial content here -->

      </div>


      <!-- ================= FLOATING SOCIALS ================= -->
      <div class="floating-socials">

        <a
          href="#"
          class="social-button whatsapp"
          aria-label="WhatsApp"
          title="WhatsApp"
        >
          WA
        </a>

        <a
          href="#"
          class="social-button facebook"
          aria-label="Facebook"
          title="Facebook"
        >
          f
        </a>

        <a
          href="#"
          class="social-button instagram"
          aria-label="Instagram"
          title="Instagram"
        >
          IG
        </a>

      </div>

    </main>

  </div>



  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">

    <div class="footer-content">

      <div>
        <strong>TUPS Technologies</strong>
        <p>
          Technology solutions for modern schools.
        </p>
      </div>

      <div class="footer-copy">
        © <span id="current-year"></span>
        TUPS Technologies. All Rights Reserved.
      </div>

    </div>

  </footer>


  <script src="app.js"></script>

</body>
</html>
